<!doctype html>
<html lang="ru">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Новогодняя акция — три оформления</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#e8e5de;color:#183328;font:14px/1.4 Arial,sans-serif}header{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:14px;padding:16px 24px;background:#10271d;color:#fff4df}h1{margin:0;font-size:17px;font-weight:400}nav,.devices{display:flex;gap:6px;flex-wrap:wrap}button,a{font:inherit}button{border:1px solid #8f9e91;background:transparent;color:inherit;border-radius:3px;padding:9px 13px;cursor:pointer;min-height:40px}button[aria-pressed=true],button[aria-pressed=true]{background:#fff4df;color:#183328;border-color:#fff4df}button:focus-visible,a:focus-visible{outline:3px solid #d5ae68;outline-offset:3px}a{color:inherit;text-underline-offset:4px}main{height:calc(100dvh - 145px);min-height:420px;position:relative;overflow:hidden;margin:0 auto}#stage{position:absolute;top:50%;left:50%;transform-origin:0 0;box-shadow:0 8px 36px #18332824;background:#10271d}iframe{display:block;border:0;width:100%;height:100%;background:#10271d}footer{display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap;padding:12px 24px}#caption{margin:0;max-width:800px}@media(max-width:760px){header{padding:12px 16px;gap:10px}h1{width:100%}main{height:calc(100dvh - 225px)}footer{padding:10px 16px;font-size:12px}button{padding:8px 10px}}
</style>
<header><h1>Новогодняя акция · до −27%</h1><nav aria-label="Оформление"><button data-variant="apple" aria-pressed="true">Хрусталь</button><button data-variant="hallmark" aria-pressed="false">Рубин</button><button data-variant="impeccable" aria-pressed="false">Типографика</button></nav><div class="devices" aria-label="Размер экрана"><button data-device="desktop" aria-pressed="true">Компьютер</button><button data-device="mobile" aria-pressed="false">Телефон</button></div></header>
<main><div id="stage"><iframe title="Предпросмотр новогоднего оформления" src="01-crystal.html"></iframe></div></main>
<footer><p id="caption">Хрустальный ёлочный шар с выгравированной скидкой. Самое лёгкое и сдержанное оформление.</p><a id="full" href="01-crystal.html" target="_blank" rel="noopener">Открыть целиком ↗</a></footer>
<script>
const variants={apple:'Хрустальный ёлочный шар с выгравированной скидкой. Самое лёгкое и сдержанное оформление.',hallmark:'Рубиновая подвеска в форме фирменного бриллианта. Самый заметный праздничный акцент.',impeccable:'Крупные ажурные цифры и свободная композиция. Выразительная типографика без подложки.'};let selected=Object.hasOwn(variants,location.hash.slice(1))?location.hash.slice(1):'apple',device='desktop';const stage=document.querySelector('#stage'),frame=document.querySelector('iframe'),main=document.querySelector('main');function size(){const w=device==='desktop'?1440:390,h=device==='desktop'?900:844,scale=Math.min((main.clientWidth-24)/w,(main.clientHeight-24)/h,1);stage.style.width=w+'px';stage.style.height=h+'px';stage.style.transform=`scale(${scale}) translate(-50%,-50%)`;}function choose(key){selected=key;frame.src=({apple:'01-crystal.html',hallmark:'02-ruby.html',impeccable:'03-typography.html'})[key];document.querySelector('#full').href=frame.src;document.querySelector('#caption').textContent=variants[key];document.querySelectorAll('[data-variant]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.variant===key)));history.replaceState(null,'','#'+key);}document.querySelectorAll('[data-variant]').forEach(b=>b.addEventListener('click',()=>choose(b.dataset.variant)));document.querySelectorAll('[data-device]').forEach(b=>b.addEventListener('click',()=>{device=b.dataset.device;document.querySelectorAll('[data-device]').forEach(x=>x.setAttribute('aria-pressed',String(x===b)));size();}));new ResizeObserver(size).observe(main);choose(selected);size();
</script>
</html>
